<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Rot Check">
  <defs>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FF2E88"/>
      <stop offset="52%"  stop-color="#FF2E88"/>
      <stop offset="52%"  stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2A0F26"/>
      <stop offset="100%" stop-color="#0A0309"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- back cards of the stack -->
  <rect x="142" y="150" width="228" height="228" rx="34"
        fill="#1E0B1C" stroke="#3D1B39" stroke-width="4"
        transform="rotate(-9 256 264)" opacity=".75"/>
  <rect x="150" y="142" width="228" height="228" rx="34"
        fill="#2C1129" stroke="#3D1B39" stroke-width="4"
        transform="rotate(5 256 256)" opacity=".9"/>

  <!-- top card: the verdict split -->
  <rect x="146" y="138" width="220" height="220" rx="34" fill="url(#split)"/>

  <!-- swipe arrows, one per verdict -->
  <path d="M232 214 L196 248 L232 282" fill="none" stroke="#12060F"
        stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 214 L316 248 L280 282" fill="none" stroke="#12060F"
        stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hazard bar: the sponsored slot -->
  <rect x="176" y="392" width="160" height="26" rx="13" fill="#FFE600"/>
</svg>
